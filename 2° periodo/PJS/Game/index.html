<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo dos Números Pares</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Divide a tela verticalmente em 3 partes: header, main e footer */
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 1. HEADER: Nível à esquerda e botões à direita */
        header {
            min-height: 100px;
            padding: 10px 24px;
            background-color: black;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #nivel {
            padding: 10px 14px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .formBotoes {
            display: flex;
            align-items: center;
        }

        /* Formato base redondo igual para todos os níveis */
        .formBotoes input[type="button"] {
            width: 80px;
            height: 80px;
            border-radius: 40px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            margin-left: 10px;
            cursor: pointer;
            transition: all 0.1s;
        }

        /* Cores padrão para Inicial, Fácil e Médio */
        .btn-play { background-color: #28a745; color: white; }
        .btn-pause { background-color: #ffc107; color: black; }
        .btn-stop { background-color: #dc3545; color: white; }

        .formBotoes:not(.modo-dificil) input[type="button"]:hover {
            opacity: 0.85;
        }

        .formBotoes:not(.modo-dificil) input[type="button"]:active {
            transform: scale(0.95);
        }

        /* Estilo original ativado apenas na opção Difícil */
        .formBotoes.modo-dificil input[type="button"] {
            background-color: red;
            color: blue;
            outline: blue solid 1px;
            outline-offset: 2px;
        }

        .formBotoes.modo-dificil input[type="button"]:hover {
            background-color: blue;
            color: red;
            outline: red solid 3px;
        }

        .formBotoes.modo-dificil input[type="button"]:active {
            transform: scale(3.9);
            background-color: green;
            color: rgb(255, 0, 200);
            outline: rgb(255, 0, 200) solid 10px;
            position: relative;
            z-index: 10;
        }

        /* 2. MAIN: Área central do jogo */
        main {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
        }

        #nroAleatorio {
            font-size: 120px;
            font-weight: bold;
            color: black;
            user-select: none;
            cursor: pointer;
            line-height: 1;
        }

        /* 3. FOOTER: Placar */
        footer {
            height: 70px;
            padding: 0 24px;
            background-color: black;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            font-size: 20px;
        }

        footer span {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <!-- Canto superior esquerdo: seleção de nível -->
        <select id="nivel" onchange="alterarNivel(this.value)">
            <option value="0" onclick="alterarNivel(0)" selected>Selecione seu nível</option>
            <option value="1" onclick="alterarNivel(1)">Fácil</option>
            <option value="2" onclick="alterarNivel(2)">Médio</option>
            <option value="3" onclick="alterarNivel(3)">Difícil</option>
        </select>

        <!-- Canto superior direito: Play, Pause e Stop da esquerda para a direita -->
        <form class="formBotoes" id="containerBotoes">
            <input type="button" class="btn-play" value="Play" onclick="play()">
            <input type="button" class="btn-pause" value="Pause" onclick="pause()">
            <input type="button" class="btn-stop" value="Stop" onclick="stop()">
        </form>
    </header>

    <main id="areaJogo">
        <p id="nroAleatorio">Pronto?</p>
    </main>

    <footer>
        <span id="acerto">_ acertos</span>
        <span id="erro">_ erros</span>
        <span id="total">Total: _ jogadas</span>
    </footer>

    <script>
        let nivelAtual = 0; // Variável inteira do nível (0 = nenhum)
        let temporizador = null;
        let acertos = 0;
        let erros = 0;
        let total = 0;
        let jogoAtivo = false;

        const cores = ['#007bff', '#28a745', '#6f42c1', '#fd7e14', '#e83e8c', '#dc3545', '#17a2b8', '#20c997'];

        function alterarNivel(valor) {
            nivelAtual = parseInt(valor, 10);
            const containerBotoes = document.getElementById("containerBotoes");

            // Ativa o visual especial dos botões apenas quando o nível Difícil (3) está selecionado
            if (nivelAtual === 3) {
                containerBotoes.classList.add("modo-dificil");
            } else {
                containerBotoes.classList.remove("modo-dificil");
            }

            if (jogoAtivo) {
                if (nivelAtual === 0) {
                    stop();
                    alert("Por favor, selecione um nível para jogar.");
                } else {
                    iniciarCiclo();
                }
            }
        }

        function play() {
            if (nivelAtual === 0) {
                alert("Por favor, selecione um nível antes de clicar em Play!");
                return;
            }

            document.getElementById("acerto").style.display = "inline";
            document.getElementById("erro").style.display = "inline";
            document.getElementById("total").style.display = "inline";
            atualizarPlacar();

            jogoAtivo = true;
            iniciarCiclo();
        }

        function iniciarCiclo() {
            clearInterval(temporizador);

            let tempo = 2000;
            if (nivelAtual === 1) tempo = 2000; // Fácil: 2 segundos
            if (nivelAtual === 2) tempo = 1200; // Médio: 1,2 segundos
            if (nivelAtual === 3) tempo = 500;  // Difícil: 0,5 segundos

            gerar(); // Gera o próximo número imediatamente
            temporizador = setInterval(gerar, tempo); // Reinicia a contagem para o novo número
        }

        function gerar() {
            const mainEl = document.getElementById("areaJogo");
            const nroEl = document.getElementById("nroAleatorio");

            const valor = Math.floor(Math.random() * 100) + 1;
            nroEl.textContent = valor;
            nroEl.style.display = "block";

            if (nivelAtual === 1) {
                mainEl.style.backgroundColor = "#ffffff";
                nroEl.style.color = "#000000";
                nroEl.style.position = "static";
            } else if (nivelAtual === 2) {
                mainEl.style.backgroundColor = "#ffffff";
                nroEl.style.color = sortearCor();
                nroEl.style.position = "static";
            } else if (nivelAtual === 3) {
                const corFundo = sortearCor();
                let corNumero = sortearCor();
                while (corNumero === corFundo) {
                    corNumero = sortearCor();
                }

                mainEl.style.backgroundColor = corFundo;
                nroEl.style.color = corNumero;

                nroEl.style.position = "absolute";
                const maxEsquerda = Math.max(0, mainEl.clientWidth - nroEl.offsetWidth);
                const maxTopo = Math.max(0, mainEl.clientHeight - nroEl.offsetHeight);

                const posX = Math.floor(Math.random() * maxEsquerda);
                const posY = Math.floor(Math.random() * maxTopo);

                nroEl.style.left = posX + "px";
                nroEl.style.top = posY + "px";
            }
        }

        function sortearCor() {
            const indice = Math.floor(Math.random() * cores.length);
            return cores[indice];
        }

        function pause() {
            clearInterval(temporizador);
            temporizador = null;
            jogoAtivo = false;
        }

        function stop() {
            clearInterval(temporizador);
            temporizador = null;
            jogoAtivo = false;

            acertos = 0;
            erros = 0;
            total = 0;
            document.getElementById("acerto").style.display = "none";
            document.getElementById("erro").style.display = "none";
            document.getElementById("total").style.display = "none";

            const mainEl = document.getElementById("areaJogo");
            const nroEl = document.getElementById("nroAleatorio");
            mainEl.style.backgroundColor = "#ffffff";
            nroEl.style.color = "#000000";
            nroEl.style.position = "static";
            nroEl.style.display = "block";
            nroEl.textContent = "Pronto?";
        }

        // Ao clicar, contabiliza o ponto e já sorteia o próximo número sem esperar o tempo acabar
        document.getElementById("nroAleatorio").addEventListener("click", function () {
            if (!jogoAtivo) return;

            const valorAtual = parseInt(this.textContent, 10);
            if (isNaN(valorAtual)) return;

            if (valorAtual % 2 === 0) {
                acertos++;
            } else {
                erros++;
            }
            total++;

            atualizarPlacar();
            iniciarCiclo();
        });

        function atualizarPlacar() {
            const txtAcerto = acertos === 1 ? "1 acerto" : `${acertos} acertos`;
            const txtErro = erros === 1 ? "1 erro" : `${erros} erros`;
            const txtTotal = total === 1 ? "Total: 1 jogada" : `Total: ${total} jogadas`;

            document.getElementById("acerto").textContent = txtAcerto;
            document.getElementById("erro").textContent = txtErro;
            document.getElementById("total").textContent = txtTotal;
        }
    </script>

</body>
</html>
